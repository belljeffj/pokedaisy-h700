name: Build PokeDaisy pak for NextUI H700

on:
  schedule:
    # Mondays 13:23 UTC (morning US Eastern). Builds only when upstream main has a new commit.
    - cron: '23 13 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream branch, tag or commit to build (default main)
        default: main
      force:
        description: Rebuild even if a release for this commit already exists
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pokedaisy-h700
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/lidor30/pokedaisy

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Find upstream commit
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || 'main' }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -eu
          sha=$(git ls-remote "$UPSTREAM" "refs/heads/$REF" "refs/tags/$REF" | head -1 | cut -f1)
          [ -n "$sha" ] || sha="$REF"   # a raw commit id
          short=$(printf %.7s "$sha")
          tag="upstream-$short"
          echo "sha=$sha"   >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1 && [ "$FORCE" != true ]; then
            echo "Release $tag already exists; nothing new upstream."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out upstream PokeDaisy
        if: steps.up.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: lidor30/pokedaisy
          ref: ${{ steps.up.outputs.sha }}
          path: upstream

      - name: Toolchain (checksum-pinned, from upstream's own script)
        if: steps.up.outputs.skip == 'false'
        working-directory: upstream
        run: |
          git submodule update --init third_party/mgba third_party/dsperate
          sudo apt-get update && sudo apt-get install -y cmake qemu-user-static
          python3 linux/setup_trimui_sdk.py "$RUNNER_TEMP/trimui-sdk"
          echo "NEXTUI_TOOLCHAIN=$RUNNER_TEMP/trimui-sdk/cross/x86_64-aarch64-nextui-linux-gnu" >> "$GITHUB_ENV"

      - name: Build and test AArch64 under QEMU
        if: steps.up.outputs.skip == 'false'
        working-directory: upstream
        run: |
          cmake -S linux -B linux/build-arm -DCMAKE_TOOLCHAIN_FILE=trimui-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_LTO=OFF \
            -DCMAKE_CROSSCOMPILING_EMULATOR="qemu-aarch64-static;-L;$NEXTUI_TOOLCHAIN/aarch64-nextui-linux-gnu/libc"
          cmake --build linux/build-arm -j2
          ctest --test-dir linux/build-arm --output-on-failure

      - name: Build and test the DS-enabled (DSperate) host under QEMU
        id: ds
        if: steps.up.outputs.skip == 'false'
        continue-on-error: true   # if DS fails, release the GBA-only build instead
        working-directory: upstream
        run: |
          # libstdc++/libgcc linked in, so the device's C++ runtime version does not matter.
          cmake -S linux -B linux/build-ds-arm -DCMAKE_TOOLCHAIN_FILE=trimui-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_LTO=OFF -DPOCKET_DSPERATE=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DCMAKE_CROSSCOMPILING_EMULATOR="qemu-aarch64-static;-L;$NEXTUI_TOOLCHAIN/aarch64-nextui-linux-gnu/libc"
          cmake --build linux/build-ds-arm -j2
          ctest --test-dir linux/build-ds-arm --output-on-failure

      - name: Assemble Tools/h700 paks
        if: steps.up.outputs.skip == 'false'
        id: pak
        env:
          DS_OK: ${{ steps.ds.outcome == 'success' }}
          SHORT: ${{ steps.up.outputs.short }}
        run: |
          set -eu
          out="$RUNNER_TEMP/out"
          objdump=$NEXTUI_TOOLCHAIN/bin/aarch64-nextui-linux-gnu-objdump
          # make_pak <packaged folder> <sd staging dir> <pak name> <Roms subfolder pattern>...
          make_pak() {
            src=$1 sd=$2 name=$3; shift 3
            pak="$sd/Tools/h700/$name.pak"
            mkdir -p "$pak"
            cp -a "$src/." "$pak/"
            rm -f "$pak/config.json"            # TrimUI Apps entry; not used by NextUI
            cp pak/launch.sh "$pak/launch.sh"   # H700 launcher: data outside the pak, raw TrimUI input off
            printf '%s\n' "$@" > "$pak/roms-folder.txt"
            chmod 755 "$pak/launch.sh" "$pak/pokedaisy-linux"
            # Record what the binary needs from the device, for debugging launch failures.
            { echo "$name needs these libraries:"; $objdump -p "$pak/pokedaisy-linux" | sed -n 's/^ *NEEDED */  /p'
              echo "Highest glibc symbol version:"
              $objdump -T "$pak/pokedaisy-linux" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 | sed 's/^/  /'
            } > "$pak/DEPENDENCIES.txt"
            cat "$pak/DEPENDENCIES.txt" | tee -a "$RUNNER_TEMP/deps.txt"
          }
          # One pak, like the Android app: the DS build (mGBA + DSperate) lists GBA and DS games together.
          if [ "$DS_OK" = true ]; then
            python3 upstream/linux/package.py --dsperate upstream/linux/build-ds-arm/pokedaisy-linux "$out"
            make_pak "$out/pokedaisy-linux-aarch64-ds-experiment" "$RUNNER_TEMP/sd" PokeDaisy 'Game Boy*' 'Nintendo DS*'
            echo "kind=GBA + DS" >> "$GITHUB_OUTPUT"
          else
            python3 upstream/linux/package.py upstream/linux/build-arm/pokedaisy-linux "$out"
            make_pak "$out/pokedaisy-linux-aarch64" "$RUNNER_TEMP/sd" PokeDaisy 'Game Boy*'
            echo "DS build failed this time; this release is GBA only." | tee -a "$RUNNER_TEMP/deps.txt"
            echo "kind=GBA only" >> "$GITHUB_OUTPUT"
          fi
          zip="$RUNNER_TEMP/PokeDaisy-h700-$SHORT.zip"
          (cd "$RUNNER_TEMP/sd" && zip -r -X "$zip" Tools)
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.up.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.up.outputs.tag }}
          SHA: ${{ steps.up.outputs.sha }}
          ZIP: ${{ steps.pak.outputs.zip }}
          KIND: ${{ steps.pak.outputs.kind }}
        run: |
          set -eu
          date=$(git -C upstream log -1 --format=%cs)
          subject=$(git -C upstream log -1 --format=%s)
          prev=$(gh release list --limit 1 --json tagName -q '.[0].tagName' || true)
          {
            echo "PokeDaisy upstream commit [\`$(printf %.7s "$SHA")\`]($UPSTREAM/commit/$SHA) ($date): $subject"
            echo
            if [ -n "$prev" ]; then
              echo "Changes since the last build: $UPSTREAM/compare/${prev#upstream-}...$SHA"
              echo
            fi
            echo "**This build: $KIND.**"
            echo
            echo "**Install / update:** copy \`PokeDaisy.pak\` from the zip's \`Tools/h700/\` into the card's"
            echo "\`Tools/h700/\`, replacing the old one. Saves and states live in \`PokeDaisy/\` on the card and"
            echo "are not touched. Back up \`PokeDaisy/saves\` first anyway."
            echo
            echo "**DS is experimental:** companion only for Pokemon Platinum (USA) rev 1; other DS games are"
            echo "emulation only. Not yet tested on H700 hardware."
            echo
            echo '```'
            cat "$RUNNER_TEMP/deps.txt"
            echo '```'
          } > notes.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$ZIP" \
            --title "PokeDaisy H700 $(printf %.7s "$SHA") ($date)" --notes-file notes.md --latest
